# Render Blueprint: https://render.com/docs/blueprint-spec
databases:
  - name: clinic-booking-db
    plan: free
    databaseName: clinic_booking
    user: clinic_booking

services:
  - type: web
    name: clinic-booking-api
    runtime: python
    plan: free
    branch: main
    # Deploy on every push/merge to main, but only once GitHub checks (CI) pass.
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    # Migrations and the idempotent seed run at start-up because the free plan has no pre-deploy step.
    startCommand: python manage.py migrate --no-input && python manage.py seed_clinic && gunicorn config.wsgi:application
    healthCheckPath: /api/doctors/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-booking-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: 'False'
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: TIME_ZONE
        value: Africa/Nairobi
